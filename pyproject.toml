[project]
name = "trailwhisperer-local"
version = "0.1.0"
description = "Investigate CloudTrail and VPC Flow Logs from Claude Code / Claude Desktop: an MCP server where the model writes Athena SQL and guardrails decide what runs."
readme = "local/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp==2.3.0",
    "boto3>=1.35",
    "sqlglot==26.0.1",
]

[project.scripts]
trailwhisperer-local = "trailwhisperer_local.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local/trailwhisperer_local"]
